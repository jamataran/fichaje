#CrossOrigins
client.url=http://localhost:4200


#Change default server port
server.port=8080

#prevent the application from stop if database is down
spring.sql.init.continue-on-error=true


#DATABASE_____________________________________________
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:mysql://localhost:3306/pruebas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid
spring.datasource.username=app
spring.datasource.password=app1234
spring.datasource.driver-class-name =com.mysql.cj.jdbc.Driver

# mostrar sentencias SQL en la consola
spring.jpa.show-sql = false

# hibernate genera SQL optimizado para MySQL 8 con InnoDB
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
# Forzar InnoDB como motor de almacenamiento (MyISAM no soporta FK ni transacciones)
spring.jpa.properties.hibernate.dialect.storage_engine = innodb


#EMAIL_________________________________________________
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=xxx
spring.mail.password=xxx

# Other properties
spring.mail.properties.mail.smtp.auth=true

# TLS , port 587
spring.mail.properties.mail.smtp.starttls.enable=true
# SSL, post 465
#spring.mail.properties.mail.smtp.socketFactory.port = 465
#spring.mail.properties.mail.smtp.socketFactory.class = javax.net.ssl.SSLSocketFactory

# security
jwt.secret = very-secure-secret
#mili segundos
jwt.expiration = 36000000

#argumentos ejecucion usuario admin
#admin.numero = fichajesPi_12345
#admin.pass = fichajesPi_12345

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
