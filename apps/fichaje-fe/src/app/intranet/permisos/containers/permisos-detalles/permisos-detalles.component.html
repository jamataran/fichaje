<div class="container-fluid mt-3">

  <h3 class="mb-4 text-center selected bg-waves rounded p-3 ">Aprobar Permiso</h3>

  @if (model(); as data) {
    <form class="mt-4 mb-4 mx-5">

      <div class="row mb-4">

        <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 d-flex align-items-end justify-content-end mb-3">
          <div class="form-group small w-100">
            <label for="descripcion"><b>Descripción:</b></label>
            <div class="input-group input-group-sm">
              <textarea type="text" class="form-control" name="descripcion" id="descripcion"
                [ngModel]="data.descripcion" disabled></textarea>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-4 col-xl-3 d-flex align-items-end justify-content-end mb-3">
          <div class="form-group small w-100">
            <label for="dia"><b>Día:</b></label>
            <div class="input-group input-group-sm">
              <input type="text" class="form-control" name="dia" id="dia" [ngModel]="data.dia" disabled>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-4 col-xl-3 d-flex align-items-end justify-content-end mb-3">
          <div class="form-group small w-100">
            <label for="hora-inicio"><b>Hora Inicio:</b></label>
            <div class="input-group input-group-sm">
              <input type="text" class="form-control" name="hora-inicio" id="hora-inicio" [ngModel]="data.horaInicio"
                disabled>
            </div>
          </div>
        </div>


        <div class="col-12 col-sm-6 col-md-4 col-lg-4 col-xl-3 d-flex align-items-end justify-content-end mb-3">
          <div class="form-group small w-100">
            <label for="hora-fin"><b>Hora Fin:</b></label>
            <div class="input-group input-group-sm">
              <input type="text" class="form-control" name="hora-fin" id="hora-fin" [ngModel]="data.horaFin" disabled>
            </div>
          </div>
        </div>

        @if (data.usuario) {
          <div class="col-12 col-sm-6 col-md-4 col-lg-4 col-xl-3 d-flex align-items-end justify-content-end mb-3">
            <div class="form-group small w-100">
              <label for="u-nombre"><b>Nombre Empleado:</b></label>
              <div class="input-group input-group-sm">
                <input type="text" class="form-control" name="u-nombre" id="u-nombre"
                  [ngModel]="data.usuario.nombreEmpleado" disabled>
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-md-4 col-lg-4 col-xl-3 d-flex align-items-end justify-content-end mb-3">
            <div class="form-group small w-100">
              <label for="u-numero"><b>Número Empleado:</b></label>
              <div class="input-group input-group-sm">
                <input type="text" class="form-control" name="u-numero" id="u-numero" [ngModel]="data.usuario.numero"
                  disabled>
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-md-4 col-lg-4 col-xl-3 d-flex align-items-end justify-content-end mb-3">
            <div class="form-group small w-100">
              <label for="u-email"><b>Email Empleado:</b></label>
              <div class="input-group input-group-sm">
                <input type="text" class="form-control" name="u-email" id="u-email" [ngModel]="data.usuario.email"
                  disabled>
              </div>
            </div>
          </div>
        }

        <div class="col-12 col-sm-6 col-md-4 col-lg-4 col-xl-3 d-flex align-items-end justify-content-end mb-3">
          <div class="form-group small w-100">
            <label for="estado"><b>Estado:</b></label>
            <div class="input-group input-group-sm">
              <input type="text" class="form-control" name="estado" id="estado" [ngModel]="data.estado" disabled>
            </div>
          </div>
        </div>

      </div>

    </form>

    <div class="row d-flex flex-row justify-content-center">
      <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 d-flex align-items-end justify-content-end mb-3">
        <button class="btn btn-sm btn-danger w-100" (click)="onDeny()"> Denegar </button>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 d-flex align-items-end justify-content-end mb-3">
        <button class="btn btn-sm btn-success w-100" (click)="onApprove()"> Aprobar </button>
      </div>
    </div>
  } @else {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>
  }

  <div class="row d-flex flex-row justify-content-end mx-5">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 d-flex align-items-end justify-content-end mb-3">
      <app-boton-volver class="w-100" routerLink="/intranet/permisos/list"></app-boton-volver>
    </div>
  </div>

  <div class="w-100 text-center mt-5 mb-5">
    <button class="mx-auto btn btn-outline-danger btn-sm " (click)="onDelete()"> <i class="bi bi-trash"></i>
      Eliminar permiso
    </button>
  </div>


</div>
